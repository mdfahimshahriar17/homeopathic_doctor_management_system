{% extends "base.html" %}
{% block content %}
    <h1 class="py-3 container">All Patient List</h1>
    <table class="table">
        <thead>
            <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Age</th>
            <th scope="col">Gender</th>
            <th scope="col">Phone</th>
            </tr>
        </thead>
        <tbody>
        {% for patient in patients %}
            <tr>
            <th scope="row">{{ patient.id }}</th>
            <td>{{ patient.name }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.gender }}</td>
            <td>{{ patient.phone }}</td>
            </tr>
        {% endfor %}
        </tbody>
        </table>
{% endblock content %}
