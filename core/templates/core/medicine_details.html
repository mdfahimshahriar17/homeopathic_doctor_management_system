{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <h1 class="py-3 container">Medicine Details</h1>
    <div class="card" style="width: 18rem;">
    <div class="card-header">
        Name: {{ patient.name }}
    </div>
    <ul class="list-group list-group-flush">
        <li class="list-group-item">ID: {{ medicine.id }}</li>
        <li class="list-group-item">Name: {{ medicine.name }}</li>
        <li class="list-group-item">Description: {{ medicine.description }}</li>
        <li class="list-group-item">Is_Active: {{ medicine.is_active }}</li>
        <li class="list-group-item">Registered Date: {{ medicine.created_at }}</li>
    </ul>
   <div class="card-footer text-end">
            <a class="btn btn-dark btn-sm mx-1" href="{% url 'medicine_edit' medicine.id %}">
                Edit
            </a>
    </div>
</div>
{% endblock  %}
